<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Login / Register | AMMY's FASHION HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-animation"></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">AMMY's <span>FASHION HUB</span></a>
      <div class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/store">Store</a>
        <a href="/about">About Us</a>
        <a href="/location">Location</a>
        <a href="/cart">Buy / Cart</a>
        <a href="/login" id="nav-login" class="btn btn-outline btn-sm active">Login</a>
        <a href="/profile" id="nav-profile" class="btn btn-outline btn-sm" style="display:none;">Profile</a>
        <button id="nav-logout" class="btn btn-outline btn-sm" style="display:none;" onclick="logout()">Logout</button>
      </div>
      <div class="nav-actions">
        <a href="/cart" class="cart-btn">🛒 <span class="cart-count" style="display:none;">0</span></a>
        <button class="mobile-toggle">☰</button>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Welcome</h2>
      <p class="subtitle">Sign in or create an account to shop</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <!-- Login Form -->
      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="regPhone" placeholder="+91 98765 43210" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    // If already logged in, redirect
    if (getToken()) {
      window.location.href = '/profile';
    }

    // Tabs
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
        hideMessages();
      });
    });

    function hideMessages() {
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return showError(data.message || 'Login failed');
        setAuth(data.token, data.user);
        showSuccess('Login successful! Redirecting...');
        setTimeout(() => window.location.href = '/profile', 1000);
      } catch (err) {
        showError('Network error. Please try again.');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      try {
        const res = await fetch(API + '/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();
        if (!res.ok) return showError(data.message || 'Registration failed');
        setAuth(data.token, data.user);
        showSuccess('Account created successfully! Redirecting...');
        setTimeout(() => window.location.href = '/profile', 1000);
      } catch (err) {
        showError('Network error. Please try again.');
      }
    });

  </script>
</body>
</html>
